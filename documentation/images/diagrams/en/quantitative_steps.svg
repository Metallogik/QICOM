<pattern id="noise" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#9a9a9a"/><circle cx="1.5" cy="1.5" r="1" fill="#e9e9e9"/><circle cx="4.5" cy="4" r="0.9" fill="#555"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
