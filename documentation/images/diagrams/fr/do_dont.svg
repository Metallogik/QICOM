<text x="110" y="227" font-size="19" font-weight="bold" text-anchor="start" fill="#1d1d1b">Vérifier la copie anonymisée</text>
<text x="110" y="255" font-size="15" font-weight="normal" text-anchor="start" fill="#555">l'ouvrir avant de partager quoi que ce soit</text>
<rect x="507" y="165" width="478" height="135" rx="14" fill="#fff" stroke="#c92a2a" stroke-width="3"/>
