<text x="602" y="227" font-size="15" font-weight="bold" text-anchor="start" fill="#1d1d1b">Croire que le texte des pixels a disparu</text>
<text x="602" y="255" font-size="14" font-weight="normal" text-anchor="start" fill="#555">le texte incrusté dans les pixels n'est pas retiré</text>
