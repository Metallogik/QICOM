id: haarpsi
name_full: "Haar Wavelet-Based Perceptual Similarity Index"
name_short: "HaarPSI"
category: reference_structural
description: >
  Perceptual similarity based on Haar wavelet decomposition, comparing
  high-frequency wavelet coefficients (weighted by local phase agreement)
  between the two images. Reisenhofer et al. (2018) report it correlating
  more closely with human judgment than SSIM/FSIM on standard benchmarks.
  Computed slice-by-slice on 3D volumes (no native 3D implementation
  available). Chromatic (color) information is not used, since QICOM
  operates on grayscale medical images.
value_range: "[0, 1]"
better_direction: higher
target_value: 1.0
parameters:
  data_range:
    required: true
    description: >
      The data range of the input images (max possible value minus min
      possible value). Must always be provided explicitly.
native_3d: false
effort: medium
